<!-- public/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Yankee Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="titlerow"><h1>The Crazy Yankee Swap!</h1></div>
    <div class="row">
        <section id="sign-up" class="section">
            <h2>Player Sign Up</h2>
            <form id="sign-up-form">
              <div>
                  <label for="playerNumber">Player Number:</label>
                  <input type="number" id="playerNumber" required>
              </div>
              <div>
                  <label for="playerName">Your Name:</label>
                  <input type="text" id="playerName" required>
              </div>
              <div>
                  <label for="giftContribution">Contribution:</label>
                  <input type="password" id="giftContribution" required>
              </div>
              <div>
                  <button type="submit">Sign Up</button>
              </div>
            </form>
          </section>
      
          <section id="round-display" class="section">
            <h2>Round Info</h2>
            <p id="round-number"></p>
          </section>

          <section id="timer-section" class="section">
            <h2>Timer</h2>
            <p id="timer">3:00</p>
            <button id="start-timer-btn">Start</button>
            <button id="pause-timer-btn">Pause</button>
            <button id="reset-timer-btn">Reset</button>
        </section>
    </div>
    <div class="buttonrow">
        <section id="start-game" class="section">
            <h2>Actions</h2>
            <button id="start-game-btn">Start Round 1</button>
            <button id="open-modal-btn">Take an Action</button>
            <button id="next-question-btn">Present Question</button>
          </section>
    </div>
    <div class="bottomrow">
        <section id="player-list" class="section">
            <h2>Player Info</h2>
            <ul id="roster-list"></ul>
          </section>

          <section id="updates" class="section">
            <h2>Game Updates</h2>
          </section>
          
    </div>    
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="close-modal-btn">&times;</span>
      <h2>Document Player Action</h2>
      <label for="playerSelect">Player:</label>
      <select id="playerSelect" required>
        <!-- Player options will be dynamically added using JavaScript -->
      </select>
      <label for="action">Action:</label>
      <select id="action" required>
        <option value="swap">Swap Present</option>
        <option value="keep">Keep Present</option>
        <option value="reorder">Swap Order</option>
        <!-- Add more options for other actions if needed -->
      </select>
      <!-- Add this dropdown for swapping -->
      <label for="swapPlayer">Swap With:</label>
      <select id="swapPlayer">
        <!-- Player options will be dynamically added using JavaScript -->
      </select>
      <label for="reorderedPlayer">Reorder With:</label>
      <select id="reorderedPlayer">
        <!-- Player options will be dynamically added using JavaScript -->
      </select>
      <button id="submit-action-btn">Submit</button>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
